[package]
name = "marius-fragment-forge"
version = "0.5.0"
edition = "2024"
description = "Build-time HTML render generator for the Marius engine. Computes static/dynamic buffer capacities."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
homepage = "https://github.com/scriptura/marius"
documentation = "https://github.com/scriptura/marius/tree/main/docs"
readme = "README.md"
keywords = ["codegen", "build-script", "marius"]
categories = ["development-tools"]

# regex : non pas pour nous économiser quelques lignes de code,
# mais afin de permettre exactement la même définition lexicale côté SQL et côté Forge,
# exprimée de manière lisible et testable.
[dependencies]
regex = "1.13"
