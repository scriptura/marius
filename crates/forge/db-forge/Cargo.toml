[package]
name = "marius-db-forge"
version = "0.5.0"
edition = "2024"
description = "Build-time generator: PostgreSQL pg_attribute → Rust #[repr(C)] structs for the Marius engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
homepage = "https://github.com/scriptura/marius"
documentation = "https://github.com/scriptura/marius/tree/main/docs"
readme = "README.md"
keywords = ["codegen", "postgresql", "build-script", "ecs", "marius"]
categories = ["development-tools", "database"]

[dependencies]
sqlx = { workspace = true }
tokio = { workspace = true }
# Interface partagée : VarlenField, FieldSpec, FieldKind, generate_render, generate_capacity_consts.
# Dépendance unidirectionnelle : db-forge → fragment-forge.
# fragment-forge n'importe jamais db-forge (INV-4).
marius-fragment-forge = { path = "../fragment-forge", version = "=0.5.0" }
