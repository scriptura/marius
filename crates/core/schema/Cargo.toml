[package]
name = "marius-schema"
description = "Generated #[repr(C)] structs and Collector statics mirroring PostgreSQL schema for the Marius engine."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["ecs", "dod", "codegen", "postgresql", "marius"]
categories = ["database", "data-structures"]
build = "build/main.rs"

[dependencies]
bytemuck = { workspace = true }
marius-collector = { workspace = true }
marius-projection = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["sync"] }

[build-dependencies]
marius-db-forge = { workspace = true }
marius-fragment-forge = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde = { workspace = true }
toml = { workspace = true }
