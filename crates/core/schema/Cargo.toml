[package]
name = "marius-schema"
description = "Generated #[repr(C)] structs and Collector statics mirroring PostgreSQL schema for the Marius engine."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["ecs", "dod", "codegen", "postgresql", "marius"]
categories = ["database", "data-structures"]
build = "build/main.rs"

[dependencies]
bytemuck = { version = "1.14", features = ["derive"] }
marius-collector = { path = "../../core/collector", version = "=0.5.0" }
marius-projection = { path = "../../core/projection", version = "=0.5.0" }
sqlx = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[build-dependencies]
marius-db-forge = { path = "../../forge/db-forge", version = "=0.5.0" }
marius-fragment-forge = { path = "../../forge/fragment-forge", version = "=0.5.0" }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8" }
