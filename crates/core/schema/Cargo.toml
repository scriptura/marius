[package]
name = "marius-schema"
version = "0.5.0"
edition = "2024"
description = "Generated #[repr(C)] structs and Collector statics mirroring PostgreSQL schema for the Marius engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
homepage = "https://github.com/scriptura/marius"
documentation = "https://github.com/scriptura/marius/tree/main/docs"
readme = "README.md"
keywords = ["ecs", "dod", "codegen", "postgresql", "marius"]
categories = ["database", "data-structures"]
build = "build/main.rs"

[dependencies]
bytemuck = { version = "1.14", features = ["derive"] }
marius-collector = { path = "../../core/collector", version = "=0.5.0" }
marius-projection = { path = "../../core/projection", version = "=0.5.0" }
sqlx = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[build-dependencies]
marius-db-forge = { path = "../../forge/db-forge", version = "=0.5.0" }
marius-fragment-forge = { path = "../../forge/fragment-forge", version = "=0.5.0" }
sqlx = { workspace = true }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8" }
