[package]
name = "marius-projection"
version = "0.3.0"
edition = "2024"
description = "Projection trait for the Marius reactive engine (Core/Shell boundary)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
readme = "README.md"
keywords = ["ecs", "projection", "marius"]
categories = ["database"]

[dependencies]
# sqlx : fetch_batch prend &PgPool (Phase 1).
# Phase 2 (SHM) : fetch_batch utilisera mmap — sqlx sera retiré du trait.
sqlx = { workspace = true }
bytemuck = { version = "1.14", features = ["derive"] }
