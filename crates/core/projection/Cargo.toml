[package]
name = "marius-projection"
version = "0.1.0"
edition = "2024"
description = "Generated Projection implementations for the Marius engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
readme = "README.md"
keywords = ["ecs", "codegen", "marius"]
categories = ["database"]

[dependencies]
marius-collector = { version = "0.1.0", path = "../../core/collector" }
marius-schema = { version = "0.1.0", path = "../../core/schema" }
sqlx = { workspace = true }
maud = { workspace = true }

[build-dependencies]
marius-bridge-forge = { version = "0.1.0", path = "../../../forge/bridge-forge" }
marius-fragment-forge = { version = "0.1.0", path = "../../../forge/fragment-forge" }
