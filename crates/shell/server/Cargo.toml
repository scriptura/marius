[package]
name = "marius-server"
version = "0.1.0"
edition = "2024"
publish = false
description = "Serveur shell pour le projet Marius"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"

# Binaire principal — point d'entrée du processus.
[[bin]]
name = "marius"
path = "src/main.rs"

[dependencies]
marius-collector = { version = "=0.2.0", path = "../../core/collector" }
marius-schema = { version = "=0.2.0", path = "../../core/schema" }
marius-projection = { version = "=0.2.0", path = "../../core/projection" }
marius-render = { version = "=0.2.0", path = "../../shell/render" }
sqlx = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
