[package]
name = "marius-server"
description = "Serveur shell pour le projet Marius — frontière réseau Axum/Tokio"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true

# Binaire applicatif (main.rs) — non publiable sur crates.io par conception
publish = false

# Binaire principal — point d'entrée du processus.
[[bin]]
name = "marius"
path = "src/main.rs"

# Réintroduction Phase 4 (handoff point 4) : sqlx, marius-collector,
# marius-schema — retirés en Phase 3 faute d'usage (lecture pure), requis de
# nouveau pour la boucle d'écriture réactive (PgListener + Dispatcher).
#
# sqlx : workspace.dependencies (racine) — déjà présent avec les features
# postgres/runtime-tokio/macros/chrono (vérifié, Cargo.toml racine fourni
# cette session). Aucune feature supplémentaire requise ici.
#
# marius-collector, marius-schema : dépendances de chemin internes au
# workspace, jamais publiées sur crates.io — pas de `version` ici (rien à
# vérifier sur un registre externe pour un membre du workspace, à la
# différence de reqwest/arc-swap en phases précédentes). Chemins déduits de
# la liste `members` du Cargo.toml racine (`crates/core/collector`,
# `crates/core/schema`), même convention que marius-render ci-dessous
# (`../../shell/render`, déjà en place) appliquée à `crates/core/*` :
# depuis `crates/shell/server/`, la remontée est `../../core/{collector,schema}`.
#
# marius-projection n'est PAS réintroduit ici : aucun usage direct identifié
# dans marius-server à ce stade (Dispatcher/regenerate_and_swap, qui en
# dépendent, vivent dans marius-render — déjà dépendant de marius-projection
# en amont, hors périmètre de ce Cargo.toml). À revoir si main.rs venait à
# nommer le trait Projection directement plutôt que de simplement transmettre
# des types déjà concrets exposés par marius-schema.
[dependencies]
marius-render = { workspace = true }
marius-collector = { workspace = true }
marius-schema = { workspace = true }
# Requis par crates/shell/server/src/experimental_t2a.rs (T2A, I1, PROVISOIRE) :
# RouteDescriptor/SegmentDescriptor/SourceSpec/SourceKey/SourceId/
# SegmentSelection/SegmentFlags/EmissionBackendKind vivent dans ce crate et ne
# sont jamais réexportés par la façade marius-render (lib.rs) — déjà épinglé
# en workspace.dependencies (racine), cette ligne ne fait que raccorder une
# arête déjà définie, pas une nouvelle dépendance externe.
marius-projection = { workspace = true }
# Requis par experimental_t2a.rs (I3, PROVISOIRE) — futures-core, pas
# futures-util (voir justification dans le Cargo.toml racine).
futures-core = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "net",
    "time",
    "macros",
    "signal",
] }
axum = { workspace = true }
sqlx = { workspace = true }
phf = { workspace = true }

# Phase 5 (Option B) : boucle de connexion bas niveau remplaçant `axum::serve`
# dans main.rs — voir le commentaire du Cargo.toml racine pour la
# justification des features. `Router` reste inchangé, adapté en service
# Hyper via `hyper_util::service::TowerToHyperService`.
hyper = { workspace = true }
hyper-util = { workspace = true }

[dev-dependencies]
# Client HTTP pour les tests d'intégration Jalon 3 (requêtes concurrentes
# contre un vrai TcpListener) — scope dev uniquement, jamais en runtime.
# default-features = false : aucun backend TLS nécessaire, ces tests ne
# parlent qu'à 127.0.0.1 en clair.
reqwest = { workspace = true }

[build-dependencies]
serde = { workspace = true }
toml = { workspace = true }
phf = { workspace = true }
phf_codegen = { workspace = true }
