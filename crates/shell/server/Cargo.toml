[package]
name = "marius-server"
version = "0.1.0"
edition = "2024"
description = "Serveur shell pour le projet Marius"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
readme = "README.md"
keywords = ["shell", "cli", "marius", "terminal", "command"]
categories = ["command-line-interface", "development-tools"]

# Binaire principal — point d'entrée du processus.
[[bin]]
name = "marius"
path = "src/main.rs"

[dependencies]
marius-collector = { path = "../../core/collector" }
marius-schema = { path = "../../core/schema" }
marius-projection = { path = "../../core/projection" }
marius-render = { path = "../../shell/render" }
sqlx = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
