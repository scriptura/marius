[package]
name    = "marius-server"
version = "0.1.0"
edition = "2024"

# Binaire principal — point d'entrée du processus.
[[bin]]
name = "marius"
path = "src/main.rs"

[dependencies]
marius-collector  = { path = "../../core/collector" }
marius-schema     = { path = "../../core/schema" }
marius-projection = { path = "../../core/projection" }
marius-render     = { path = "../../shell/render" }
sqlx              = { workspace = true }
tokio             = { workspace = true }
axum              = { workspace = true }
