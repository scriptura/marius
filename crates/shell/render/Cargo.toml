[package]
name = "marius-render"
description = "Dispatcher and artifact rendering shell for the Marius reactive engine."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["axum", "web", "dispatcher", "marius"]
categories = ["web-programming"]

[dependencies]
sqlx = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "fs",
    "macros",
    "rt-multi-thread",
] }
rayon = { workspace = true }
memmap2 = { workspace = true }
bytemuck = { workspace = true }
arc-swap = { workspace = true }
marius-collector = { workspace = true }
marius-projection = { workspace = true }
marius-schema = { workspace = true }

[dev-dependencies]
divan = { workspace = true }

[build-dependencies]
marius-fragment-forge = { workspace = true }

[[bench]]
name = "hot_path_render"
harness = false

[[bench]]
name = "hot_path_certify"
harness = false

[[bin]]
name = "marius-dump"
path = "src/bin/dump.rs"

[[bin]]
name = "marius-verify"
path = "src/bin/verify.rs"
