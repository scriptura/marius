[package]
name = "marius-render"
version = "0.1.0"
edition = "2024"
description = "Artifact writing and Axum integration shell for the Marius engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/votre-org/marius"
readme = "README.md"
keywords = ["axum", "web", "marius"]
categories = ["web-programming"]

[dependencies]
marius-collector = { version = "0.1.0", path = "../../core/collector" }
marius-schema = { version = "0.1.0", path = "../../core/schema" }
marius-projection = { version = "0.1.0", path = "../../core/projection" }
sqlx = { workspace = true }
tokio = { workspace = true }
maud = { workspace = true }
rayon = { workspace = true }
axum = { workspace = true }

[build-dependencies]
marius-fragment-forge = { version = "0.1.0", path = "../../../forge/fragment-forge" }
