[package]
name = "marius-render"
description = "Dispatcher and artifact rendering shell for the Marius reactive engine."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
keywords = ["axum", "web", "dispatcher", "marius"]
categories = ["web-programming"]

[dependencies]
memmap2 = "0.9.10"
bytemuck = { version = "1.14", features = ["derive"] }
arc-swap = "1.9.1"
marius-collector = { version = "=0.5.0", path = "../../core/collector" }
marius-projection = { version = "=0.5.0", path = "../../core/projection" }
marius-schema = { version = "=0.5.0", path = "../../core/schema" }

# Shell — Tokio et Rayon vivent uniquement ici (pas dans le Core)
tokio = { workspace = true }
rayon = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
divan = "0.1"
marius-schema = { version = "=0.5.0", path = "../../core/schema" }

[build-dependencies]
marius-fragment-forge = { version = "=0.5.0", path = "../../forge/fragment-forge" }

[[bench]]
name = "hot_path_render"
harness = false

[[bench]]
name = "hot_path_certify"
harness = false

[[bin]]
name = "marius-dump"
path = "src/bin/dump.rs"

[[bin]]
name = "marius-verify"
path = "src/bin/verify.rs"
