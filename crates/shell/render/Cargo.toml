[package]
name = "marius-render"
version = "0.3.0"
edition = "2024"
description = "Dispatcher and artifact rendering shell for the Marius reactive engine."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
readme = "README.md"
keywords = ["axum", "web", "dispatcher", "marius"]
categories = ["web-programming"]

[dependencies]
# Core
marius-collector = { path = "../../core/collector", version = "=0.3.0" }
marius-projection = { path = "../../core/projection", version = "0.3.0" }

# Shell — Tokio et Rayon vivent uniquement ici (pas dans le Core)
tokio = { workspace = true }
rayon = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
divan = "0.1"
marius-schema = { path = "../../core/schema", version = "=0.3.0" }

[build-dependencies]
marius-fragment-forge = { path = "../../../forge/fragment-forge", version = "0.3.0" }

[[bench]]
name = "hot_path_render"
harness = false

[[bench]]
name = "hot_path_certify"
harness = false
