
[package]
name = "marius"
version = "0.5.0"
edition = "2024"
description = "Marius: a data-oriented reactive projection engine. PostgreSQL → AOT HTML, zero intermediate transformation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scriptura/marius"
readme = "README.md"
keywords = ["ecs", "dod", "reactive", "cms", "aot"]
categories = ["web-programming", "database", "concurrency"]

[dependencies]
marius-collector = { version = "=0.5.0", path = "../core/collector" }
marius-projection = { version = "=0.5.0", path = "../core/projection" }
marius-render = { version = "=0.5.0", path = "../shell/render" }
