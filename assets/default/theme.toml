[theme]
name = "default"
# La version ici est indicative pour le développeur. 
# Le cache-busting final restera piloté par le hash BLAKE3 des octets.
version = "1.0.0"

# ==========================================
# Pipelines de transformation
# ==========================================

[styles]
# Liste plate des points d'entrée. 
# Le compilateur va lire ces fichiers, résoudre leurs @import internes, et générer les artéfacts.
entries = ["styles/main.mcss", "styles/print.mcss"]

[scripts.capabilities.disclosure]
entry = "scripts/disclosure.js"
markers = ["tabs", "accordion"]
activation = "initDisclosureSystem"

[scripts.capabilities.map]
entry = "scripts/map.js"
markers = ["map"]
activation = "bootstrap"

[scripts.capabilities.media-player]
entry = "scripts/media-player.js"
markers = ["media"]
activation = "bootstrap"

[scripts.capabilities.line-mark]
entry = "scripts/line-mark.js"
markers = ["add-line-marks"]
activation = "boot"

[scripts.capabilities.image-focus]
entry = "scripts/image-focus.js"
markers = ["figure-image-focus"]
activation = "initImageFocusSystem"

[scripts.capabilities.youtube]
entry = "scripts/youtube.js"
markers = ["video-youtube"]
activation = "bootstrap"

[scripts.capabilities.range]
entry = "scripts/range.js"
markers = ["range", "range-multithumb"]
activation = "initSliders"

[scripts.components]
# Dictionnaire (HashMap) : Cible -> Dossier Source.
# Spécification §10.4.1 : un dossier = une cible de concaténation.
# Le compilateur concatène le contenu du dossier et génère /scripts/<cible>.<hash>.js.
# map2 = "scripts/map2.js"

[sprites]
# Dictionnaire (HashMap) : Nom du Sprite -> Dossier Source.
# Spécification §10.2 : SVG groupés dans un fichier `<cible>.<hash>.svg`.
utils = "sprites/utils"
# players = "sprites/players"

[webmanifest]
entry = "manifest.webmanifest"

[service_worker]
# Handoff §3 — point d'entrée unique, à la racine du thème, même convention que [webmanifest].entry.
entry = "scripts/service-worker.js"

# ==========================================
# Pipelines de copie (Zéro-Transformation)
# ==========================================

[static.verbatim]
# Fichiers copiés bit-à-bit vers le build (favicons, polices, libs vendored).
# Le compilateur préserve le type MIME et applique le hash, sans toucher au contenu.
files = [
    "favicons/favicon.ico",
    "favicons/favicon.svg",
    "favicons/apple-touch-icon.png",
    "favicons/logoAny.svg",
    "favicons/logo192.png",
    "favicons/logo512.png",
    "fonts/notoSans-Regular.woff2",
    "fonts/notoSerif-Regular.woff2",
    "sprites/filter.svg",
    "sprites/silos/195v.svg",
    "images/logo.svg",
    "images/tests/test.webp",
    "images/tests/test-w4000.webp",
    "images/tests/test-w3000.webp",
    "images/tests/test-w2500.webp",
    "images/tests/test-w2000.webp",
    "images/tests/test-w1500.webp",
    "images/tests/test-w1000.webp",
    "images/tests/test-w800.webp",
    "images/tests/test-w600.webp",
    "images/tests/test-w400.webp",
    "images/tests/test-w300.webp",
    "images/atlas.svg",
    "libraries/deckgl/deckgl.js",
    # "libraries/htmx.min.js",
]
