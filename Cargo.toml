[workspace]
resolver = "2"
members = [
    # Forge (build-time uniquement — jamais en [dependencies] runtime)
    "forge/db-forge",
    "forge/fragment-forge",
    "forge/guard-forge",
    "forge/bridge-forge",

    # Core (no_std attitude)
    "crates/core/collector",
    "crates/core/schema",
    "crates/core/projection",

    # Shell (std)
    "crates/shell/render",
    "crates/shell/server",
]

# Versions partagées — source de vérité unique pour les dépendances communes.
[workspace.dependencies]
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "macros",
    "chrono",
] }
tokio = { version = "1", features = ["full"] }
maud = { version = "0.26", features = ["axum"] }
rayon = "1.10"
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
