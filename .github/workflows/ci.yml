name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Le workflow ne nécessite aucun droit d'écriture sur le dépôt.
permissions:
  contents: read

# Annule les exécutions obsolètes d'une même branche/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (Rust 1.100.0)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # DATABASE_URL est volontairement absent.
      # Une variable vide provoque Configuration(RelativeUrlWithoutBase).
      # Sans override shell, Cargo applique la valeur définie dans
      # .cargo/config.toml, configuration validée localement sous Rust 1.100.0.

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Aligné sur rust-toolchain.toml et workspace.package.rust-version.
      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - name: Verify Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
          test "$(rustc --version | awk '{print $2}')" = "1.100.0"
          test "$(cargo --version | awk '{print $2}')" = "1.100.0"

      # La clé intègre notamment Cargo.lock, les manifests, rust-toolchain.toml
      # et .cargo/config.toml. Le choix de toolchain intervient avant le cache.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Le manifeste est généré par marius-assets et absent d'un checkout propre.
      # Le produire avant les build scripts de marius-schema et marius-server.
      - name: Build static assets manifest
        run: cargo run --locked --release -p marius-assets --bin marius-assets -- ./assets/default

      - name: Check all workspace targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features
