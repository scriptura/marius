# .github/workflows/alloc_certification.yml
# CI — Certification Zéro-Allocation du pipeline de rendu Marius
#
# ─── Déclencheurs ────────────────────────────────────────────────────────────
#
#   push sur main et develop : détecte les régressions au merge.
#   pull_request vers main   : bloque la PR si une allocation est introduite.
#   workflow_dispatch        : exécution manuelle depuis l'interface GitHub.
#
# ─── Ce que ce workflow certifie ─────────────────────────────────────────────
#
#   P::render() n'effectue aucune allocation sur le tas pendant son exécution
#   une fois le buffer pré-alloué à STATIC_CAP + DYNAMIC_CAP.
#   Invariant ADR-003 : buf.reserve() est un no-op au runtime.
#
#   Le binaire hot_path_certify embarque CountingAlloc comme allocateur global.
#   L'assertion ALLOC_COUNT == 0 est posée dans bench_certify_zero_alloc()
#   avec un buffer pré-chauffé, sur 100 samples × pires cas varlena.
#
# ─── Ce que ce workflow ne certifie PAS ──────────────────────────────────────
#
#   Il ne certifie pas render_batch_pure() (Rayon) : elle alloue O(T) buffers
#   via map_with — comportement attendu et documenté dans ADR-003.
#
# ─── Artifacts produits ───────────────────────────────────────────────────────
#
#   logs/certify_ci_*.txt : rapport d'exécution Divan (uploadé en artifact).

name: Alloc Certification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-zero-alloc:
    name: Zero-allocation certification (render_chunks)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      # Ne pas définir DATABASE_URL à une chaîne vide : cela casse le parsing
      # de l'URL dans le build script. Cargo utilise .cargo/config.toml.

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.100.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - name: Verify Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
          test "$(rustc --version | awk '{print $2}')" = "1.100.0"
          test "$(cargo --version | awk '{print $2}')" = "1.100.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.9.3

      # Le build script de marius-schema requiert le manifeste généré avant
      # même la compilation du benchmark marius-render.
      - name: Build static assets manifest
        run: cargo run --locked --release -p marius-assets --bin marius-assets -- ./assets/default

      # cargo bench compile et exécute le binaire lui-même. On ne dépend donc
      # pas d'un emplacement supposé (deps/ ou build/.../out/) pour le retrouver.
      # Le filtre sélectionne les deux certifications : rendu courant et
      # rendu avec corps segmenté volumineux.
      - name: Run zero-allocation certifications
        shell: bash
        run: |
          set -o pipefail
          mkdir -p logs
          LOG="logs/certify_ci_${GITHUB_RUN_ID}.txt"
          cargo bench --locked \
            -p marius-render \
            --bench hot_path_certify \
            -- "certify/zero_alloc_in_render" 2>&1 | tee "$LOG"

      - name: Upload certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certify-report-${{ github.run_id }}
          path: logs/certify_ci_*.txt
          if-no-files-found: warn
          retention-days: 30
